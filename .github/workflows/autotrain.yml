name: HF AutoTrain Dataset Push
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
jobs:
  push-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install HF Hub
        run: pip install huggingface_hub
      - name: Push dataset to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN
          huggingface-cli upload Hoodx/mira-dataset data/train.jsonl data/train.jsonl --repo-type dataset
